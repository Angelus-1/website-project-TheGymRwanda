<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/dist/output.css" />
    <title>Website project template</title>
  </head>
  <script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
        });
    };
  </script>
  <body>
    <div id="navbar"></div>

    <main class="pt-[104px]">
      <div id="hero"></div>
      <div id="about"></div>
      <div id="services"></div>
      <div id="references"></div>
      <div id="contact"></div>
    </main>

    <script>
      loadComponents("navbar", "./src/sections/navbar.html");
      loadComponents("hero", "./src/sections/hero.html");
      loadComponents("about", "./src/sections/about.html");
      loadComponents("services", "./src/sections/services.html");
      loadComponents("references", "./src/sections/references.html");
      loadComponents("contact", "./src/sections/contact.html");
    </script>
  </body>
</html>
