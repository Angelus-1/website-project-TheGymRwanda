<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/dist/output.css" />
    <script src="/src/script.js"></script>
    <title>Website project template</title>
  </head>
  <body>
    <div id="navbar"></div>

    <main class="pt-26">
      <div id="hero"></div>
      <div id="main"></div>
    </main>

    <div id="footer"></div>

    <script>
      window.onload = () => {
        loadComponents("navbar", "./src/sections/navbar.html", () => {
          const menuBtn = document.getElementById("menu-btn");
          const closeBtn = document.getElementById("close-btn");
          const mobileMenu = document.getElementById("mobile-menu");

          menuBtn.addEventListener("click", () => {
            mobileMenu.classList.remove("hidden");
            menuBtn.classList.add("hidden");
          });

          closeBtn.addEventListener("click", () => {
            mobileMenu.classList.add("hidden");
            menuBtn.classList.remove("hidden");
          });
        });

        loadComponents("hero", "./src/sections/hero.html");
        loadComponents("main", "./src/sections/main.html");
        loadComponents("footer", "./src/sections/footer.html");
      };
    </script>
  </body>
</html>
